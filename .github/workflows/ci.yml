name: CI

# Linux runs on every push (cheap). macOS and Windows builds - which produce the
# VST3/AU plug-ins for every DAW - run on version tags (v*) and on manual start, because
# macOS minutes count 10x on private repositories.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux - build, unit tests, host test, pluginval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target livelooper_VST3 livelooper_tests livelooper_hosttest

      - name: Unit tests + VST3 host test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: pluginval (strictness 5)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --validate build/livelooper_artefacts/Release/VST3/livelooper.vst3

  plugins:
    name: ${{ matrix.name }} - plug-in build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            pluginval: pluginval_macOS.zip
            pluginvalBin: ./pluginval.app/Contents/MacOS/pluginval
          - name: Windows
            os: windows-latest
            pluginval: pluginval_Windows.zip
            pluginvalBin: ./pluginval.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee ctest.log || {
            # make the failing checks visible as annotations on the run
            grep -E '!!!|FAILED|failed' ctest.log | head -n 40 | while IFS= read -r line; do echo "::error title=Unit test::$line"; done
            exit 1
          }

      - name: pluginval (strictness 5)
        shell: bash
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}
          unzip -q pluginval.zip
          ${{ matrix.pluginvalBin }} --strictness-level 5 --skip-gui-tests --validate-in-process \
            --validate build/livelooper_artefacts/Release/VST3/livelooper.vst3

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/livelooper
          cp -R build/livelooper_artefacts/Release/VST3/livelooper.vst3 dist/livelooper/
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R build/livelooper_artefacts/Release/AU/livelooper.component dist/livelooper/
            cp -R build/livelooper_artefacts/Release/Standalone/livelooper.app dist/livelooper/
          else
            cp build/livelooper_artefacts/Release/Standalone/livelooper.exe dist/livelooper/
          fi
          cp docs/en/INSTALLATION.md dist/livelooper/INSTALLATION.md
          cp docs/de/INSTALLATION.md dist/livelooper/INSTALLATION-DE.md
          cd dist && 7z a -tzip ../livelooper-${{ matrix.name }}.zip livelooper > /dev/null || zip -qr ../livelooper-${{ matrix.name }}.zip livelooper

      - uses: actions/upload-artifact@v7
        with:
          name: livelooper-${{ matrix.name }}
          path: livelooper-${{ matrix.name }}.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
